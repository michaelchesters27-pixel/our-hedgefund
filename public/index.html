<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OUR HEDGEFUND</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080b10;color:#f7f9fc}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -15%,#25334d 0,#111722 36%,#080b10 70%)}
.wrap{max-width:980px;margin:auto;padding:32px 18px 60px}
.card{background:rgba(18,24,35,.92);border:1px solid #29354a;border-radius:22px;box-shadow:0 22px 65px rgba(0,0,0,.28)}
.login{max-width:440px;margin:12vh auto;padding:28px}
.kicker{color:#8fa1bc;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
h1{font-size:clamp(30px,6vw,52px);margin:5px 0;letter-spacing:.06em}
.muted{color:#8fa1bc}
label{display:block;margin:18px 0 8px;color:#aab6ca;font-size:13px}
select,input{width:100%;border:1px solid #34425b;background:#0d131d;color:#fff;padding:14px;border-radius:12px;font-size:16px}
button{border:0;border-radius:12px;padding:13px 16px;font-weight:800;cursor:pointer}
.primary{width:100%;margin-top:18px;background:#f0f4ff;color:#101520}
.error{min-height:22px;color:#ff9d9d;margin-top:10px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.logout{background:transparent;color:#aab6ca;border:1px solid #31405a}
.hero{text-align:center;padding:30px;margin-bottom:18px}
.amount{font-size:clamp(48px,9vw,82px);font-weight:900;letter-spacing:-.05em;margin:10px 0 4px}
.live{font-size:13px;color:#82e6b2}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#46d58a;margin-right:7px}
.members{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.member{padding:22px}.member.me{border-color:#6f82ac;box-shadow:0 0 0 1px #6f82ac inset}
.name{font-size:21px;font-weight:900}.pct{font-size:13px;color:#8fa1bc;margin-top:4px}
.value{font-size:31px;font-weight:900;margin:18px 0 16px}
.overview{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat{padding:18px}.statLabel{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#7f91ad}
.statValue{font-size:24px;font-weight:900;margin-top:7px}.statSub{font-size:12px;color:#8fa1bc;margin-top:5px}
.positive{color:#82e6b2}.negative{color:#ff9d9d}.neutral{color:#d5deed}
.metrics{border-top:1px solid #29354a;padding-top:13px;margin-top:4px}
.row{display:flex;justify-content:space-between;gap:14px;padding:5px 0;font-size:13px}
.row span:first-child{color:#8fa1bc}.row strong{text-align:right}
.riskBox{margin-top:14px;padding:14px;border:1px solid #2d3a50;border-radius:14px;background:#0d131d}
.riskTop{display:flex;justify-content:space-between;gap:12px;align-items:center}
.badge{font-size:10px;font-weight:900;letter-spacing:.09em;padding:5px 8px;border-radius:999px;border:1px solid #42516a;color:#aab6ca}
.badge.ok{border-color:#2e9c67;color:#82e6b2}.progress{height:7px;background:#202a3a;border-radius:999px;overflow:hidden;margin-top:10px}
.progress span{display:block;height:100%;background:#82a8ff;border-radius:999px}.riskText{font-size:11px;color:#8fa1bc;margin-top:7px}
.foot{text-align:center;color:#5f6f88;font-size:12px;margin-top:20px}
@media(max-width:720px){.members,.overview{grid-template-columns:1fr}.header{align-items:flex-start;gap:12px}}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="card login">
    <div class="kicker">Private account</div>
    <h1>OUR HEDGEFUND</h1>
    <div class="muted">Micky · Doc</div>

    <label>Your name</label>
    <select id="who">
      <option value="micky">Micky</option>
      <option value="doc">Doc</option>
    </select>

    <label>PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Enter PIN">

    <button class="primary" onclick="login()">Log in</button>
    <div id="loginError" class="error"></div>
  </div>

  <div id="app" style="display:none">
    <div class="header">
      <div><div class="kicker">Private account</div><h1>OUR HEDGEFUND</h1></div>
      <button class="logout" onclick="logout()">Log out</button>
    </div>

    <div class="card hero">
      <div class="kicker">Live account pot</div>
      <div id="pot" class="amount">—</div>
      <div class="live"><span class="dot"></span><span id="status">Waiting for MT5</span></div>
    </div>

    <div id="overview" class="overview"></div>
    <div id="members" class="members"></div>
    <div class="foot">MT5 balance and equity · updates automatically</div>
  </div>
</div>

<script>
let token=localStorage.getItem("ohf_token")||"";
let state=null;

const money=(n,c)=>new Intl.NumberFormat("en-GB",{
  style:"currency",currency:c||"USD",minimumFractionDigits:2
}).format(Number(n||0));

const signedMoney=(n,c)=>{
  const v=Number(n||0);
  if(Math.abs(v)<0.005)return money(0,c);
  return (v>0?"+":"-")+money(Math.abs(v),c);
};
const signedPct=(n)=>{
  const v=Number(n||0);
  if(Math.abs(v)<0.005)return "0.00%";
  return (v>0?"+":"")+v.toFixed(2)+"%";
};
const pnlClass=(n)=>Number(n)>0?"positive":Number(n)<0?"negative":"neutral";

async function api(path,options={}){
  options.headers={
    ...(options.headers||{}),
    "Content-Type":"application/json",
    ...(token?{"Authorization":"Bearer "+token}:{})
  };
  const res=await fetch(path,options);
  let data={};
  try{data=await res.json()}catch{}
  if(!res.ok)throw new Error(data.error||"Request failed");
  return data;
}

async function login(){
  document.getElementById("loginError").textContent="";
  try{
    const name=document.getElementById("who").value;
    const pin=document.getElementById("pin").value;
    const data=await api("/api/login",{method:"POST",body:JSON.stringify({name,pin})});
    token=data.token;
    localStorage.setItem("ohf_token",token);
    showApp();
    await refresh();
  }catch(e){
    document.getElementById("loginError").textContent=e.message;
  }
}

function logout(){
  token="";
  state=null;
  localStorage.removeItem("ohf_token");
  document.getElementById("app").style.display="none";
  document.getElementById("login").style.display="block";
}

function showApp(){
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
}

function render(){
  if(!state)return;
  const startLabel=state.trackingStart
    ?new Date(state.trackingStart+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})
    :"start";

  document.getElementById("pot").textContent=state.updatedAt?money(state.livePot,state.currency):"Waiting…";
  document.getElementById("status").textContent=state.updatedAt
    ?"LIVE · "+new Date(state.updatedAt).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"})
    :"Waiting for MT5";

  const fundRemaining=Number(state.riskFreeRemaining||0);
  const fundProgress=Math.max(0,Math.min(100,Number(state.riskFreeProgressPct||0)));

  document.getElementById("overview").innerHTML=`
    <div class="card stat">
      <div class="statLabel">Starting pot</div>
      <div class="statValue">${money(state.initialFund,state.currency)}</div>
      <div class="statSub">Tracking from ${startLabel}</div>
    </div>
    <div class="card stat">
      <div class="statLabel">Since start</div>
      <div class="statValue ${pnlClass(state.fundProfitLoss)}">${signedMoney(state.fundProfitLoss,state.currency)}</div>
      <div class="statSub ${pnlClass(state.fundReturnPct)}">${signedPct(state.fundReturnPct)} return</div>
    </div>
    <div class="card stat">
      <div class="statLabel">Both risk-free target</div>
      <div class="statValue">${money(state.riskFreeFundTarget,state.currency)}</div>
      <div class="statSub">${state.riskFreeAchieved?"Risk-free available":money(fundRemaining,state.currency)+" still needed"}</div>
      <div class="progress"><span style="width:${fundProgress}%"></span></div>
    </div>
  `;

  document.getElementById("members").innerHTML=state.members.map(m=>{
    const progress=Math.max(0,Math.min(100,Number(m.riskFreeProgressPct||0)));
    return `
      <div class="card member ${m.slug===state.me?"me":""}">
        <div class="name">${m.name}</div>
        <div class="pct">${m.ownershipPct.toFixed(2)}% ownership</div>
        <div class="value">${money(m.value,state.currency)}</div>

        <div class="metrics">
          <div class="row"><span>Initial deposit</span><strong>${money(m.initialDeposit,state.currency)}</strong></div>
          <div class="row"><span>Since ${startLabel}</span><strong class="${pnlClass(m.profitLoss)}">${signedMoney(m.profitLoss,state.currency)}</strong></div>
          <div class="row"><span>Return</span><strong class="${pnlClass(m.returnPct)}">${signedPct(m.returnPct)}</strong></div>
        </div>

        <div class="riskBox">
          <div class="riskTop">
            <div>
              <div class="statLabel">Risk-free target</div>
              <strong>${money(m.riskFreeTarget,state.currency)}</strong>
            </div>
            <span class="badge ${m.riskFreeAchieved?"ok":""}">${m.riskFreeAchieved?"RISK-FREE AVAILABLE":"BUILDING"}</span>
          </div>
          <div class="progress"><span style="width:${progress}%"></span></div>
          <div class="riskText">${m.riskFreeAchieved
            ?"Your profit now covers your original "+money(m.initialDeposit,state.currency)+" deposit."
            :money(m.riskFreeRemaining,state.currency)+" more account value needed before your original deposit is covered by profit."}</div>
        </div>
      </div>
    `;
  }).join("");
}

async function refresh(){
  if(!token)return;
  try{
    state=await api("/api/state");
    render();
  }catch{
    logout();
  }
}

if(token){showApp();refresh();}
setInterval(()=>{if(token)refresh()},2000);
</script>
</body>
</html>
